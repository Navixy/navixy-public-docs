# =============================================================================
# NAVIXY 4 - GraphQL Schema — Audit
# Version: 0.16.27
# =============================================================================
#
# The audit log's types, which every product's schema reads: an event, its connection, its filter
# and order, and the vocabularies they use.
# What a row holds is described in
#
#
# Types it references but does not declare: the kernel's `Node`, `Connection`, `Edge`, `PageInfo`,
# `CountInfo`, `Actor`, `Code`, `JSON`, `DateTime`, `OrderDirection`, and BDR's `Workspace`
# (`AuditEvent.workspace`).
#
# SOURCE TYPE:
#   An audit event of a call an AI client made through the MCP server records
#   AGENT, whatever the kind of actor. Any other event records its source by
#   the kind of actor: INTERNAL for the events the server records on its own,
#   such as mirroring a workspace from Console, and API for every caller of
#   the API, an API key included. WEB, MOBILE and INTEGRATION are not
#   recorded.
#
# =============================================================================

# @category: bdr/audit
"The source type identifying the origin of an API request."
enum SourceType {
  "Request originated from a web browser application."
  WEB
  "Request originated from a mobile application (iOS/Android)."
  MOBILE
  "Request made directly via the API."
  API
  "Request generated by an internal system process."
  INTERNAL
  "Request made by an external integration."
  INTEGRATION
  "Request an AI client made through the MCP server."
  AGENT
}

# @category: bdr/audit
"The type of event recorded in the audit log."
enum AuditEventType {
  "A new entity was created."
  CREATED
  "An existing entity was modified."
  UPDATED
  "An entity was deleted."
  DELETED
  "A soft-deleted entity was restored."
  RESTORED
}

# @category: bdr/audit
"An audit log entry recording an event that occurred in the system."
type AuditEvent implements Node {
  id: ID!
  """
  The workspace the event was recorded in. `auditEvents` and `entityHistory` list only the caller's
  workspace's events, so this is always the caller's workspace.
  """
  workspace: Workspace
  "The id of the actor who triggered the event: a user's id from Console, a member of staff's, or the system's."
  actorId: ID
  "The actor who triggered the event; null when there is none or Console does not know the id."
  actor: Actor
  "The client IP address."
  ipAddress: String
  "The client User-Agent string."
  userAgent: String
  "The source type of the request."
  sourceType: SourceType!
  "The distributed tracing ID (32 hex characters) for log correlation."
  traceId: String
  "The type of entity affected."
  aggregateType: Code
  "The ID of the affected entity."
  aggregateId: ID
  "The type of event that occurred."
  eventType: AuditEventType!
  "The product the event belongs to, such as `bdr`."
  product: Code!
  "The event payload with details such as changed fields."
  eventData: JSON
  "The date and time when the event occurred."
  occurredAt: DateTime!
}

# --- AuditEvent Connection ---

# @category: bdr/audit
"A paginated list of AuditEvent items."
type AuditEventConnection implements Connection {
  "A list of edges."
  edges: [AuditEventEdge!]!
  "A list of nodes in the connection (without edge metadata)."
  nodes: [AuditEvent!]!
  "Information about the current page."
  pageInfo: PageInfo!
  "The total count of items matching the filter."
  total: CountInfo
}

# @category: bdr/audit
"An edge in the AuditEvent connection."
type AuditEventEdge implements Edge {
  "An opaque cursor for this edge."
  cursor: String!
  "The audit event at the end of the edge."
  node: AuditEvent!
}

# --- AuditEvent ---

# @category: bdr/audit
"Filtering options for audit events."
input AuditEventFilter {
  "Filter by actors (OR within field)."
  actorIds: [ID!]
  "Filter by entity types (OR within field)."
  aggregateTypes: [Code!]
  "Filter by specific entity IDs (OR within field)."
  aggregateIds: [ID!]
  "Filter by event types (OR within field)."
  eventTypes: [AuditEventType!]
  "Filter by source types (OR within field)."
  sourceTypes: [SourceType!]
  """
  Filter by products (OR within field). Absent or empty: every product the field reads that the caller may read.
  `BdrQuery`'s fields read the products whose events the server keeps: a product the caller may not read is refused
  with PERMISSION_DENIED, and one it may read that the server does not keep with VALIDATION_ERROR. A field that reads
  one product, such as `BillingQuery.myAuditEvents`, refuses any other with VALIDATION_ERROR.
  """
  products: [Code!]
  "Filter by trace ID."
  traceId: String
  "Return events that occurred after this timestamp."
  from: DateTime
  "Return events that occurred before this timestamp."
  to: DateTime
}

# @category: bdr/audit
"Ordering options for audit events."
input AuditEventOrder {
  "The field to order by."
  field: AuditEventOrderField!
  "The direction to order."
  direction: OrderDirection!
}

# @category: bdr/audit
"Fields available for ordering audit events."
enum AuditEventOrderField {
  "Order by occurrence date."
  OCCURRED_AT
}
