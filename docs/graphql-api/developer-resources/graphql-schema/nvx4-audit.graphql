# Version: 0.17.13

# @category: common/audit
"The source type identifying the origin of an API request."
enum SourceType {
  "Not recorded: every event has API, INTERNAL or AGENT."
  WEB
  "Not recorded: every event has API, INTERNAL or AGENT."
  MOBILE
  "A request from a person or an API key through the API."
  API
  "A change the server made on its own, such as mirroring a workspace from Console."
  INTERNAL
  "Not recorded: every event has API, INTERNAL or AGENT."
  INTEGRATION
  "A call an AI client made through the MCP server, whatever the kind of actor."
  AGENT
}

# @category: common/audit
"The type of event recorded in the audit log."
enum AuditEventType {
  "A new entity was created."
  CREATED
  "An existing entity was modified."
  UPDATED
  "An entity was deleted."
  DELETED
  "A soft-deleted entity was restored."
  RESTORED
}

# @category: common/audit
"An audit log entry recording an event that occurred in the system."
type AuditEvent implements Node
  @dataClass(class: ORDINARY) {
  id: ID!
  """
  The workspace the event was recorded in; null for an event of no workspace: an organization's own event, or one of
  neither, such as a member of staff's write to billing's catalog. `BdrQuery`'s `myAuditEvents` and
  `myEntityHistory` list only the caller's workspace's events, so there it is always the caller's workspace.
  `BillingQuery.myAuditEvents` in the scope `ORGANIZATION` lists the caller's organization's own events and the events
  of its workspaces, and billing's staff `auditEvents` and `entityHistory` list the events of any workspace. On
  `IamQuery` and `ConsoleQuery`, `myAuditEvents` and `myEntityHistory` resolve it only to the caller's own workspace,
  and it is null for an event of any other.
  """
  workspace: Workspace
  "The id of the actor who triggered the event: a user's id from Console, a member of staff's, or the system's."
  actorId: ID @dataClass(class: PERSONAL)
  "The actor who triggered the event; null when there is none or Console does not know the id."
  actor: Actor
  "The client IP address."
  ipAddress: String @dataClass(class: PERSONAL)
  "The client User-Agent string."
  userAgent: String @dataClass(class: PERSONAL)
  """
  The AI client's own name for itself: the name a client gave the MCP server, or the agent name in an API key's token.
  A label the client chose, not who triggered the event (`actor`); null when the call named no agent.
  """
  agentName: String @dataClass(class: PERSONAL)
  "The source type of the request."
  sourceType: SourceType!
  "The distributed tracing ID (32 hex characters) for log correlation."
  traceId: String
  "The type of entity affected."
  aggregateType: Code
  "The ID of the affected entity."
  aggregateId: ID
  """
  What happened, as the product that recorded the event names it, such as `device_created` or `role_assigned`.
  Each product keeps its own codes and may add new ones, so a client shows a code it does not know as it is.
  """
  eventCode: String!
  "What the event did to its entity: created, modified, deleted or restored it."
  operation: AuditEventType!
  "What the event did to its entity; the same value as `operation`."
  eventType: AuditEventType! @deprecated(reason: "Use operation instead. Removal: 2027-Q3")
  "The product the event belongs to, such as `bdr`."
  product: Code!
  "The event payload with details such as changed fields."
  eventData: JSON @dataClass(class: PERSONAL)
  "The date and time when the event occurred."
  occurredAt: DateTime!
}

# @category: common/audit
"A paginated list of AuditEvent items."
type AuditEventConnection implements Connection
  @dataClass(class: ORDINARY) {
  "A list of edges."
  edges: [AuditEventEdge!]!
  "A list of nodes in the connection (without edge metadata)."
  nodes: [AuditEvent!]!
  "Information about the current page."
  pageInfo: PageInfo!
  "The total count of items matching the filter."
  total: CountInfo
}

# @category: common/audit
"An edge in the AuditEvent connection."
type AuditEventEdge implements Edge
  @dataClass(class: ORDINARY) {
  "An opaque cursor for this edge."
  cursor: String!
  "The audit event at the end of the edge."
  node: AuditEvent!
}

# @category: common/audit
"""
Filtering options for audit events. The server that keeps the events can bound each statement of a read by a
statement timeout, five seconds by default: a read that runs longer fails with `VALIDATION_ERROR` and no field, and a
narrower one goes through: a shorter period between `from` and `to`, exact values instead of `*Contains` text, or
fewer products. A field whose filter sets `*Contains` text that is not blank adds 50 to the request's complexity, so
one request holds only a few such reads.
"""
input AuditEventFilter {
  "Filter by actors (OR within field)."
  actorIds: [ID!] @dataClass(class: PERSONAL)
  "Partial match on actor ID (case-insensitive contains)."
  actorIdContains: String @trim @dataClass(class: PERSONAL)
  "Filter by entity types (OR within field)."
  aggregateTypes: [Code!]
  "Partial match on entity type (case-insensitive contains)."
  aggregateTypeContains: String @trim
  "Filter by specific entity IDs (OR within field)."
  aggregateIds: [ID!]
  "Partial match on entity ID (case-insensitive contains)."
  aggregateIdContains: String @trim
  """
  Filter by event codes (OR within field), each matched exactly as the product recorded it, letter case included. A
  code no event has matches nothing.
  """
  eventCodes: [String!]
  """
  Filter by operations (OR within field). Naming both `operations` and `eventTypes` fails with `VALIDATION_ERROR`.
  """
  operations: [AuditEventType!]
  "Filter by operations (OR within field); the same as `operations`."
  eventTypes: [AuditEventType!] @deprecated(reason: "Use operations instead. Removal: 2027-Q3")
  "Filter by source types (OR within field)."
  sourceTypes: [SourceType!]
  """
  Filter by products (OR within field). Each field reads one product, such as `bdr` for `BdrQuery.myAuditEvents` and
  `billing` for `BillingQuery.myAuditEvents`. Absent or empty: that product; any other product fails with
  VALIDATION_ERROR.
  """
  products: [Code!]
  "Filter by trace ID."
  traceId: String
  "Partial match on trace ID (case-insensitive contains)."
  traceIdContains: String @trim
  "Return events that occurred after this timestamp."
  from: DateTime
  "Return events that occurred before this timestamp."
  to: DateTime
}

# @category: common/audit
"Ordering options for audit events."
input AuditEventOrder {
  "The field to order by."
  field: AuditEventOrderField!
  "The direction to order."
  direction: OrderDirection!
}

# @category: common/audit
"Fields available for ordering audit events."
enum AuditEventOrderField {
  "Order by occurrence date."
  OCCURRED_AT
}
