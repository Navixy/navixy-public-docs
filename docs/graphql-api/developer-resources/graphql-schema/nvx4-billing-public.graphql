  externalId: String
  "Human-readable line description (will appear on the invoice)."
  description: String!
  "Quantity reported for the period."
  quantity: Float!
  "Unit price for this line."
  unitPrice: Money!
  "Optional total amount; if null, the invoicer derives it from quantity * unitPrice."
  amount: Money
  "Inclusive lower bound of the reporting window."
  periodStart: DateTime!
  "Exclusive upper bound of the reporting window."
  periodEnd: DateTime!
  "Arbitrary justification metadata; not regulated."
  extraData: JSON
  "Identifier of the invoice this submission has been claimed by; null while in the unbilled pool."
  invoiceId: ID
  "When the submission was claimed onto an invoice; null iff invoiceId is null."
  invoicedAt: DateTime
  "When billing accepted the submission, from the server clock. A producer cannot supply its own."
  submittedAt: DateTime!
  "The actor that sent the submission, or `system` when billing could not attribute it. Resolved server-side; a producer cannot supply its own."
  submittedBy: String!
}

# =============================================================================
# INVOICES (since 0.15.0)
# =============================================================================
# A workspace sees its invoices as BillingWorkspaceInvoice: the same row as the staff BillingInvoice, with a line's
# subscription and plan as ids. The status and the ordering serve both realms.

# @category: billing/invoice
"Lifecycle of an invoice. Billing writes ISSUED, PAID and OVERDUE; DRAFT and VOID are reserved and never set."
enum BillingInvoiceStatus {
  "Assembled but not yet issued to the customer."
  DRAFT
  "Issued and outstanding."
  ISSUED
  "Settled."
  PAID
  "Issued, past its due date, still outstanding."
  OVERDUE
  "Cancelled without being paid."
  VOID
}

# @category: billing/invoice
"Ordering options for invoices."
input BillingInvoiceOrder {
  "The field to order by."
  field: BillingInvoiceOrderField!
  "The direction to order."
  direction: OrderDirection!
}

# @category: billing/invoice
"Fields available for ordering invoices."
enum BillingInvoiceOrderField {
  "Order by the day the invoice was issued."
  ISSUED_AT
}

# @category: billing/invoice
"""
One of the caller's own workspace's invoices: its charge for every complete billing period of its subscriptions that
no invoice covered yet, as of one pass. `periodStart` and `periodEnd` span the periods covered. The total is posted to
the balance as the `INVOICE` entry on its statement.

`status` is `PAID` at issue when the balance covers the total, and `ISSUED` when the invoice opens a debt.
Payments are not tied to invoices and settle the oldest invoices first; the payment that covers an invoice marks it
`PAID` and sets `paidAt`. Once the grace period has passed (`dueAt`), the daily pass marks an unpaid one `OVERDUE`.
"""
type BillingWorkspaceInvoice {
  id: ID!
  "The workspace being charged: the one the token names."
  workspaceId: ID!
  "Human-facing number, unique across the schema."
  invoiceNumber: String!
  "First instant of the earliest billing period covered."
  periodStart: DateTime!
  "End of the latest billing period covered, exclusive."
  periodEnd: DateTime!
  "Sum of the line items, before adjustments."
  subtotal: Money!
  "Signed adjustment applied to the subtotal — a discount is negative."
  priceModify: Money!
  "What the customer owes: `subtotal` plus `priceModify`."
  total: Money!
  "Current lifecycle status."
  status: BillingInvoiceStatus!
  "When the invoice was issued. Its place in a list is this, not `createdAt`."
  issuedAt: DateTime!
  "When payment is due."
  dueAt: DateTime!
  "When it was paid; null while it is not."
  paidAt: DateTime
  "The lines, in display order: per covered period, the period fees, then every metric of the plan, then the line-item submissions."
  lineItems: [BillingWorkspaceInvoiceLineItem!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# @category: billing/invoice
"""
One line of a workspace's invoice: a period fee, a metric's priced usage, or a line-item submission passed through.
`amount` is `quantity × unitPrice` rounded half up to the minor unit, except on a line-item submission that carried
its own amount.
"""
type BillingWorkspaceInvoiceLineItem {
  id: ID!
  "What the line charges for, ending with the billing period it belongs to, as `, 2026-01-15 – 2026-02-14`."
  description: String!
  "Units charged: the share of the month on a period-fee line, the aggregated usage over the included limit on a metric line, the quantity as submitted on a line-item line. `metric.unit` names the unit."
  quantity: Float!
  "Price of one unit in the invoice's currency."
  unitPrice: Money!
  "The line's total."
  amount: Money!
  "The product the line belongs to."
  productDomain: BillingProductDomain
  "The metric the line prices; null on a period-fee line and on a line-item submission's line."
  metric: BillingMetric
  "The subscription the line charges for, as in `mySubscriptions`."
  subscriptionId: ID
  "The plan that priced the line; the subscription's branch, when it has one, overrode this plan's fee and prices."
  planId: ID
  "First instant of the billing period the line belongs to."
  periodStart: DateTime
  "End of that billing period, exclusive."
  periodEnd: DateTime
  createdAt: DateTime!
}

# @category: billing/invoice
"A page of the caller's own workspace's invoices."
type BillingWorkspaceInvoiceConnection implements Connection {
  "A list of edges."
  edges: [BillingWorkspaceInvoiceEdge!]!
  "A list of nodes in the connection (without edge metadata)."
  nodes: [BillingWorkspaceInvoice!]!
  "Information about the current page."
  pageInfo: PageInfo!
  "The total count of items matching the filter."
  total: CountInfo
}

# @category: billing/invoice
"An edge in the BillingWorkspaceInvoice connection."
type BillingWorkspaceInvoiceEdge implements Edge {
  "An opaque cursor for this edge."
  cursor: String!
  "The invoice at the end of the edge."
  node: BillingWorkspaceInvoice!
}

# @category: billing/invoice
"Filtering options for the caller's own invoices. Fields combine with AND."
input BillingWorkspaceInvoiceFilter {
  "Keep only invoices in this status."
  status: BillingInvoiceStatus
  "Keep only invoices issued at or after this instant."
  issuedFrom: DateTime
  "Keep only invoices issued at or before this instant."
  issuedTo: DateTime
}

