  "The metric value reported for the period."
  metricValue: Float!
  "Inclusive lower bound of the reporting window."
  periodStart: DateTime!
  "Exclusive upper bound of the reporting window."
  periodEnd: DateTime!
  "Pricing dimension values used for VOLUME pricing tier resolution (key/value JSON)."
  pricingDimensions: JSON
  "Modifier values used for FLAT pricing multipliers (key/value JSON)."
  usageModifiers: JSON
  "Arbitrary justification metadata; not regulated."
  extraData: JSON
  "Identifier of the invoice this submission has been claimed by; null while in the unbilled pool."
  invoiceId: ID
  "When the submission was claimed onto an invoice; null iff invoiceId is null."
