# Declares the base type, which other contract files extend. The SDK's code generator reads this
# file but not every file that extends it, so the base type has to be declared here.
"Billing module queries: the caller's own workspace's plan catalogue, subscriptions, balances, and the usage-metric and invoice-line-item submissions product services reported for it. Reached through `Query.billing`."
type BillingQuery {
  # @category: billing/plan
  """
  Lists the plans and branches the caller's own workspace may subscribe to, with the subscription it
  already holds on each.

  **The workspace is not an argument.** It is the one the caller's token names, so this operation
  cannot be pointed at a tenant the token does not name. A token carrying no workspace claim is
  refused rather than answered: see [Authentication](https://navixy.com/docs/navixy-graphql-api/authentication).

  Unpaginated: the answer is bounded by the catalogue a single workspace can see.
  """
  myAvailablePlans: [BillingAvailablePlan!]!

  # @category: billing/subscription
  """
  The caller's own workspace's subscriptions, most recent first.

  Answers where `myAvailablePlans` cannot: a subscription to a plan that has since been archived, or
  whose active window closed, or whose target list no longer includes the workspace, is absent from
  the catalogue but still in effect. This is the query for "what am I on".
  """
  mySubscriptions(
    "Filtering options for the returned subscriptions."
    filter: BillingWorkspaceSubscriptionFilter
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    before: String
    "The ordering options for the returned subscriptions."
    orderBy: BillingSubscriptionOrder = { field: SUBSCRIBED_AT, direction: DESC }
  ): BillingWorkspaceSubscriptionConnection!

  # @category: billing/balance
  "The caller's own workspace's balance. Opened at zero if nothing has opened it yet."
  myBalance: BillingBalance!

  # @category: billing/balance
  """
  The movements of the caller's own workspace's balance, newest first, as a statement.

  `balanceAfter` is a property of the journal, not of this ordering: an entry carries the same running
  total whichever direction you read in. Reversing the direction reverses the order lines arrive in
  and nothing else.
  """
  myBalanceEntries(
    "Filtering options for the returned entries."
    filter: BillingBalanceEntryFilter
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    before: String
    "The ordering options for the returned entries."
    orderBy: BillingBalanceEntryOrder = { field: CREATED_AT, direction: DESC }
  ): BillingBalanceEntryConnection!

  # @category: billing/invoice
  "One of the caller's own workspace's invoices; null when it does not exist or belongs to another workspace."
  myInvoice("The ID of the invoice to retrieve." id: ID!): BillingWorkspaceInvoice

  # @category: billing/invoice
  """
  The caller's own workspace's invoices, newest issue date first.

  **The workspace is not an argument.** It is the one the caller's token names; a token carrying no
  workspace claim is refused.
  """
  myInvoices(
    "Filtering options for the returned invoices."
    filter: BillingWorkspaceInvoiceFilter
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    before: String
    "The ordering options for the returned invoices."
    orderBy: BillingInvoiceOrder = { field: ISSUED_AT, direction: DESC }
  ): BillingWorkspaceInvoiceConnection!

  # @category: billing/submission
  """
  The usage-metric submissions reported for the caller's own workspace, newest first by default.

  **The workspace is not an argument.** It is the one the caller's token names; a token carrying no
  workspace claim is refused.
  """
  myUsageMetricSubmissions(
    "Filtering options for the returned submissions."
    filter: BillingUsageMetricSubmissionFilter
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    before: String
    "The ordering options for the returned submissions."
    orderBy: BillingUsageMetricSubmissionOrder = { field: SUBMITTED_AT, direction: DESC }
  ): BillingUsageMetricSubmissionConnection!

  # @category: billing/submission
  """
  The invoice-line-item submissions reported for the caller's own workspace, newest first by default.

  **The workspace is not an argument.** It is the one the caller's token names; a token carrying no
  workspace claim is refused.
  """
  myInvoiceLineItemSubmissions(
    "Filtering options for the returned submissions."
    filter: BillingInvoiceLineItemSubmissionFilter
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    before: String
    "The ordering options for the returned submissions."
    orderBy: BillingInvoiceLineItemSubmissionOrder = { field: SUBMITTED_AT, direction: DESC }
  ): BillingInvoiceLineItemSubmissionConnection!
}

# =============================================================================
# MUTATIONS
# =============================================================================

# Base type — see the note on BillingQuery above.
"Billing module mutations: subscribing the caller's own workspace to a plan. Reached through `Mutation.billing`."
type BillingMutation {
  # @category: billing/subscription
  """
  Subscribes the caller's own workspace to a plan, optionally on a branch.

  **The workspace is not in the input.** It is the one the caller's token names, so this mutation
  cannot put a tenant the token does not name onto a paid plan. A token carrying no workspace claim
  is refused.

  With it disabled, any token naming a workspace can put that workspace on a paid plan.

  The plan is validated before the subscription is taken: the plan, or the branch, must be a row
  that `myAvailablePlans` offers the workspace; the branch must belong to the plan; and no product
  of the plan may be covered by one of the workspace's active subscriptions. A token whose workspace
  claim names no workspace in this deployment fails with `VALIDATION_ERROR`. A workspace gets at
  most one trial per plan: once a subscription to the plan or to one of its branches has carried a
  trial, later ones start without.
  """
  mySubscribe(
    "The plan, and optionally the branch. The workspace is the caller's own and is not passed in."
    input: BillingMySubscribeInput!
  ): BillingWorkspaceSubscribePayload
}
