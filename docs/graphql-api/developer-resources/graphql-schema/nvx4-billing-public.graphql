# =============================================================================
# Billing public schema — exposed through the SDK
# Version: 0.15.0
# =============================================================================
#
# What a customer's own token may do in billing: read its usage-metric and invoice-line-item
# submissions with the reference types they denormalize (BillingProductDomain, BillingMetric), and —
# since 0.6.0 — `myAvailablePlans` and `mySubscribe`, with the catalogue and pricing vocabulary they
# need, and — since 0.15.0 — `myInvoices` and `myInvoice`. Every operation here acts on the workspace the token
# names and accepts no workspace argument.
#
# Money and Currency are used here too but declared in nvx4-common.graphql — see below.
#
# Plan administration is not part of this contract. A workspace sees a subscription as
# BillingWorkspaceSubscription: the same row with the plan and branch as ids.
#
# Other contract files in this directory merge with this one at runtime; the root schema reaches its
# operations through `Query.billing` and `Mutation.billing`.
#
# Relies on shared infrastructure from nvx4-common.graphql: Node, Versioned, DateTime, JSON,
# Connection, Edge, PageInfo, CountInfo, Money, Currency, Code, Long, OrderDirection, @trim —
# plus GraphQL's built-in ID scalar.
#
# VERSIONING
# ----------
# The `Version:` above is the billing schema's own version, maintained
# independently of the core schema version in nvx4-bdr.graphql (started at
# 0.1.0). Follow the evolutionary versioning & deprecation policy documented in nvx4-bdr.graphql

# =============================================================================
# REFERENCE TYPES
# =============================================================================

# @category: billing/plan
"A billable product in the billing catalog."
type BillingProductDomain implements Node & Versioned {
  id: ID!
  "The version number for optimistic locking."
  version: Int!
  "Machine-readable product code."
  code: Code!
  "Optional human-readable title."
  title: String
  "Optional description."
  description: String
  "Whether this product is active."
  isActive: Boolean!
  """
  Whether this product may take part in plans. True by default.

  When false, no new plan may include the product. Plans that already include it stay in force,
  but an update that resends their pricing schemas is refused.
  """
  isBillable: Boolean!
  "The product's user-facing address: an absolute http or https URL. Null when not set."
  productUrl: String
  "The product's internal path: an absolute http or https URL, or a path starting with a single '/'. Null when not set."
  internalPath: String
}

# @category: billing/plan
"A billable metric."
type BillingMetric implements Node & Versioned {
  id: ID!
  "The version number for optimistic locking."
  version: Int!
  "Machine-readable metric code."
  code: Code!
  "Optional human-readable title."
  title: String
  "Optional description."
  description: String
  "Optional measurement unit (for example: count, GB, requests)."
  unit: String
  "Whether this metric is active."
  isActive: Boolean!
}

# =============================================================================
# PRICING VOCABULARY (moved here in 0.6.0)
# =============================================================================
#
# Types declared here may reference only this file and nvx4-common.graphql.

# @category: billing/plan
"Function used to aggregate metric values over a billing period."
enum BillingAggregationFunction {
  SUM
  MAX
  MIN
  AVG
  LAST
}

# @category: billing/plan
"The pricing model for a metric."
enum BillingPricingModel {
  "Fixed price per unit."
  FLAT
  "Usage is split across tiers; each tier has its own price."
  TIERED
  "All usage is priced at the tier the total falls into."
  VOLUME
  "Included in the subscription fee; no per-unit charge."
  SUBSCRIPTION
}

# @category: billing/plan
"Final usage pricing for a plan item. Fields depend on the parent pricingModel."
type BillingUsagePricing {
  "Price per unit in minor currency units (FLAT model)."
  price: Long
  "Pricing tiers (TIERED and VOLUME models)."
  tiers: [BillingUsagePricingTier!]
  "Attribute used to select the pricing tier, for example: device_count (VOLUME)."
  pricingDimension: String
  "How pricing dimension values are aggregated (VOLUME)."
  pricingDimensionAggregation: BillingAggregationFunction
}

# @category: billing/plan
"A tier in a plan's tiered or volume pricing."
type BillingUsagePricingTier {
  "Lower bound of the tier (inclusive)."
  from: Float!
  "Upper bound of the tier: exclusive for TIERED, where the next tier starts, and inclusive for VOLUME; null means unlimited."
  to: Float
  "Price for this tier in minor currency units."
  price: Long!
}

# =============================================================================
# PLANS A WORKSPACE MAY TAKE (moved here in 0.6.0)
# =============================================================================

# @category: billing/plan
"A plan or branch available to a workspace. When branchId is null this is a base plan; when set it represents a branch override."
type BillingAvailablePlan {
  "The base plan ID."
  planId: ID!
  "The branch ID (null for base plans)."
  branchId: ID
  "Human-readable title."
  title: String!
  "Optional description."
  description: String
  "ISO 4217 currency."
  currency: Currency!
  """
  What the plan charges per billing period regardless of usage, in `currency`. The sum of its
  per-schema fees — a branch's overrides where it sets them, the base plan's fee elsewhere.
  """
  periodFee: Money!
  "Must be a positive integer if provided; null means no trial."
  trialDays: Int
  "Pricing items. For base plans — plan items; for branches — branch override items."
  items: [BillingAvailablePlanItem!]!
  """
  The workspace's own subscription to this exact plan and branch, or null when it holds none.

  Only an `ACTIVE` subscription counts: a cancelled one must not render as subscribed. Matched on the
  pair — a subscription to a branch does not mark the base plan as taken, and the reverse.
  """
  subscription: BillingWorkspaceSubscription
}

# @category: billing/plan
"A pricing item in the available-plans list. For base plan items branchItemId is null; for branch overrides it is set and planItemId references the base plan item."
type BillingAvailablePlanItem {
  "The base plan item ID."
  planItemId: ID!
  "The branch item ID (null for base plan items)."
  branchItemId: ID
  "The metric being priced."
  metric: BillingMetric!
  "How metric values are aggregated."
  aggregationFunction: BillingAggregationFunction!
  "Free usage included in the period fee."
  includedLimit: Float
  "Soft usage limit."
  quota: Float
  "Percentage thresholds for quota warnings."
  warningThresholds: [Int!]
  "The pricing model."
  pricingModel: BillingPricingModel!
  "Usage pricing details (base or custom override)."
  usagePricing: BillingUsagePricing!
}

# @category: billing/subscription
"Lifecycle status of a workspace's subscription."
enum BillingSubscriptionStatus {
  "The subscription is currently in effect."
  ACTIVE
  "The subscription has been cancelled (replaced by another or stopped explicitly)."
  CANCELLED
}

# @category: billing/subscription
"""
A workspace's own view of one of its subscriptions: the plan and branch as ids, and the dates.

Not a `Node`. Read a subscription through `mySubscriptions`. `myAvailablePlans` shows an active
subscription on the row of its exact plan and branch, for as long as the catalogue still offers
that row.
"""
type BillingWorkspaceSubscription {
  "The identifier of the subscription."
  id: ID!
  "The workspace holding it."
  workspaceId: ID!
  "The plan subscribed to."
  planId: ID!
  "The branch, when the subscription is to one rather than to the base plan."
  branchId: ID
  "Current lifecycle status."
  status: BillingSubscriptionStatus!
  "When the workspace subscribed."
  subscribedAt: DateTime!
  "When it expires; null while it does not."
  expiresAt: DateTime
  "When it was cancelled; null while it is in effect."
  cancelledAt: DateTime
  "When the trial granted on it expires; null when no trial was granted."
  trialExpiresAt: DateTime
}

# @category: billing/subscription
"What `mySubscribe` answers with."
type BillingWorkspaceSubscribePayload {
  "The subscription as taken."
  subscription: BillingWorkspaceSubscription!
}

# @category: billing/subscription
"A page of the caller's own subscriptions."
type BillingWorkspaceSubscriptionConnection implements Connection {
  "A list of edges."
  edges: [BillingWorkspaceSubscriptionEdge!]!
  "A list of nodes in the connection (without edge metadata)."
  nodes: [BillingWorkspaceSubscription!]!
  "Information about the current page."
  pageInfo: PageInfo!
  "The total count of items matching the filter."
  total: CountInfo
}

# @category: billing/subscription
"An edge in the BillingWorkspaceSubscription connection."
type BillingWorkspaceSubscriptionEdge implements Edge {
  "An opaque cursor for this edge."
  cursor: String!
  "The subscription at the end of the edge."
  node: BillingWorkspaceSubscription!
}

# @category: billing/subscription
"""
Filtering options for the caller's own subscriptions. Fields combine with AND.

No workspace field: the workspace is the caller's own and is never accepted from outside.
"""
input BillingWorkspaceSubscriptionFilter {
  "Filter by plan."
  planId: ID
  "Filter by status. Omitted returns both active and cancelled."
  status: BillingSubscriptionStatus
}

# @category: billing/subscription
"""
Input for subscribing the caller's own workspace to a plan.

It has no workspace field: the workspace is the one the caller's token names.
"""
input BillingMySubscribeInput {
  "The plan to subscribe to."
  planId: ID!
  "Optional plan branch (null = subscribe to the base plan)."
  branchId: ID
}

# @category: billing/balance
"""
The prepaid balance a workspace holds. A workspace holds exactly one, in USD.

`amount` is signed: negative means the workspace owes. It is a running total kept in step with the
workspace's posting journal, and the journal — the balance's statement entries — stays the source of
truth for how the total was reached.
"""
type BillingBalance implements Node {
  id: ID!
  "The workspace this balance belongs to."
  workspaceId: ID!
  "The current total, signed. Negative means the workspace owes."
  amount: Money!
  "When the balance was opened: on the workspace's creation, its first read, or its first posting, whichever came first."
  createdAt: DateTime!
  "When the balance last moved."
  updatedAt: DateTime!
}

# @category: billing/balance
"What moved a balance."
enum BillingBalanceEntryType {
  "A charge issued against the balance."
  INVOICE
  "A staff-authored correction, in either direction."
  CORRECTION
  """
  Money the customer sent, credited to the balance. Distinct from a correction on purpose: one is
  cash taken in, the other is revenue given away, and a statement that called both a correction
  would make the two impossible to tell apart.
  """
  TOP_UP
}

# @category: billing/balance
"""
One movement of a workspace's balance, as a line on a statement.

Not a stored row: an entry is a posting joined to the document that justifies it, and `balanceAfter`
is derived at read time rather than stored against the posting. A payment whose `valueDate` falls
before existing entries therefore shifts every line after it, the way a statement should, instead of
leaving a stale snapshot behind.

An entry is identified but not addressable — there is no `node(id:)` lookup for one, because a line
only means anything within the statement that produced it.
"""
type BillingBalanceEntry {
  "The identifier of the posting behind this entry."
  id: ID!
  "When the posting happened."
  createdAt: DateTime!
  "What moved the balance."
  type: BillingBalanceEntryType!
  "Signed from the workspace's side: positive credits the balance, negative debits it."
  amount: Money!
  "The balance total immediately after this entry. Independent of the ordering you requested."
  balanceAfter: Money!
  """
  What the justifying document has to say for itself: a correction's reason, an invoice's number, a
  payment's note. Null whenever that document has nothing to say, which is routine for a `TOP_UP` --
  the line is labelled by its `type`, so there is nothing the accountant has to type.

  Not a ready-to-display label. The label belongs to `type` and needs translating; this is the
  operator's or the document's own words and does not.
  """
  description: String
  """
  The actor on whose authority the posting was made — the staff member behind a correction, the
  accountant who entered a top-up, or the service account behind a charge. Never absent: every posting
  is attributable. An id, not a name: billing does not hold actors, so rendering a person needs a
  second lookup.
  """
  authoredBy: ID!
}

# @category: billing/balance
"A page of balance entries."
type BillingBalanceEntryConnection implements Connection {
  "A list of edges."
  edges: [BillingBalanceEntryEdge!]!
  "A list of nodes in the connection (without edge metadata)."
  nodes: [BillingBalanceEntry!]!
  "Information about the current page."
  pageInfo: PageInfo!
  "The total count of items matching the filter."
  total: CountInfo
}

# @category: billing/balance
"An edge in the BillingBalanceEntry connection."
type BillingBalanceEntryEdge implements Edge {
  "The balance entry at the end of the edge."
  node: BillingBalanceEntry!
  "A cursor for use in pagination."
  cursor: String!
}

# @category: billing/balance
"""
Filtering options for balance entries.

Narrowing a statement to a period does not restart its running totals: `balanceAfter` still
accumulates over the whole journal, so the first line of a period carries the balance carried into
that period rather than the period's own subtotal.

Only time is filterable, and that is a constraint rather than an oversight — a statement window has
to stay a contiguous run of the journal for its running totals to mean anything. Dropping, say,
every charge and keeping the corrections would leave each surviving line with a total that no
sequence of shown lines adds up to.
"""
input BillingBalanceEntryFilter {
  "Keep only entries posted at or after this instant."
  createdAtFrom: DateTime
  "Keep only entries posted at or before this instant."
  createdAtTo: DateTime
}

# @category: billing/balance
"Ordering options for balance entries."
input BillingBalanceEntryOrder {
  "The field to order by."
  field: BillingBalanceEntryOrderField!
  "The direction to order."
  direction: OrderDirection!
}

# @category: billing/balance
"Fields available for ordering balance entries."
enum BillingBalanceEntryOrderField {
  "Order by the time the posting happened."
  CREATED_AT
}

# @category: billing/subscription
"Ordering options for subscriptions."
input BillingSubscriptionOrder {
  "The field to order by."
  field: BillingSubscriptionOrderField!
  "The direction to order."
  direction: OrderDirection!
}

# @category: billing/subscription
"Fields available for ordering subscriptions."
enum BillingSubscriptionOrderField {
  "Order by when the workspace subscribed."
  SUBSCRIBED_AT
}

