# Version: 0.17.12

# @category: console/organizations
"""
An organization the caller can access, as Console reports it.

`node(id:)` and `nodes(ids:)` resolve an organization id only among the caller's own organizations, the ones
`console.accessibleOrganizations` lists. Any other organization id resolves to null, and so does every organization
id when the token does not carry the organization and workspace a call to Console needs, or Console refuses the
caller. An organization id minted under another deployment flag or region is refused with VALIDATION_ERROR.
When Console cannot answer (not configured on the deployment, unreachable or failing), the organization
resolves to null and an error with `extensions.code` SERVICE_UNAVAILABLE and `extensions.dependency` `console` names
its path; the other ids of the same `nodes(ids:)` call resolve as usual.
"""
type ConsoleOrganization implements Node {
  "Console's own organization id, the same id as `Workspace.organizationId` and `AccessibleOrganization.id`."
  id: ID!
  "Console's URL-safe slug for the organization."
  slug: String!
  "Human-readable organization name."
  displayName: String!
  "Console's own organization-type vocabulary (e.g. \"customer\", \"partner\")."
  orgType: String!
  "The caller's own roles in this organization, as Console reports them."
  roles: [String!]!
}

# @category: console/organizations
"A page of organizations the caller can access."
type ConsoleOrganizationConnection implements Connection {
  edges: [ConsoleOrganizationEdge!]!
  nodes: [ConsoleOrganization!]!
  pageInfo: PageInfo!
  "The total count of items matching the filter."
  total: CountInfo
}

# @category: console/organizations
"An edge in a ConsoleOrganizationConnection."
type ConsoleOrganizationEdge implements Edge {
  "An opaque cursor for this edge."
  cursor: String!
  node: ConsoleOrganization!
}

# @category: console/workspaces
"A workspace the caller can access, as Console reports it."
type ConsoleWorkspace {
  """
  The workspace id, the same id as `Workspace.id`. `node(id:)` resolves it to that `Workspace` when it
  is the workspace the caller's token names, and to null otherwise.
  """
  id: ID!
  "Human-readable workspace name."
  workspaceName: String!
  "The id of the organization this workspace belongs to, the same id as `ConsoleOrganization.id`."
  organizationId: ID!
  "Human-readable name of the organization this workspace belongs to."
  organizationDisplayName: String!
  "Console's own workspace-status vocabulary (e.g. \"active\", \"suspended\")."
  status: String!
  "Human-readable name of the zone (region/cluster) this workspace is hosted in."
  zoneDisplayName: String!
  "Console's own region code for the zone this workspace is hosted in. Null when the zone has none."
  zoneRegion: String
}

# @category: console/workspaces
"A page of workspaces the caller can access."
type ConsoleWorkspaceConnection implements Connection {
  edges: [ConsoleWorkspaceEdge!]!
  nodes: [ConsoleWorkspace!]!
  pageInfo: PageInfo!
  """
  The total count of items matching the filter, with precision APPROXIMATE: Console's count includes
  every workspace that matches, also one whose id is not a `Workspace.id` this server accepts, such
  as an older workspace or one issued for another region or deployment. Such a workspace is left out
  of edges and nodes, so the count can be higher than what this connection returns.
  """
  total: CountInfo
}

# @category: console/workspaces
"An edge in a ConsoleWorkspaceConnection."
type ConsoleWorkspaceEdge implements Edge {
  "An opaque cursor for this edge."
  cursor: String!
  node: ConsoleWorkspace!
}

# @category: console/members
"""
A person or agent in the caller's organization, as Console reports it. Reading members needs
Console administration; without it the field answers PERMISSION_DENIED.
"""
type ConsoleMember {
  """
  Console's id for the actor, the `actorId` that `iam.memberRoles` and `iam.memberRoleAssign` take.
  `node(id:)` does not resolve it.
  """
  actorId: UUID!
  "Console's own principal vocabulary: \"human\" or \"agent\"."
  principalType: String!
  "Console's own vocabulary for the kind of agent (e.g. \"integration\", \"ai_agent\"). Null for a person."
  principalSubtype: String
  "Human-readable name. Null when Console has none."
  displayName: String
  "Email address. Null for an agent, or when Console has none."
  email: String
  "Avatar URL. Null when Console has none."
  avatarUrl: String
  "Console's own role-preset vocabulary (e.g. \"owner\"). What the organization granted, not what the caller may do."
  rolePreset: String!
  "Console's own membership-status vocabulary: invited, active, suspended or removed."
  status: String!
  "When the member joined the organization. Null while invited."
  joinedAt: DateTime
  "The assurance profile IAM holds for the member. Null when IAM has no access record for them, not a default profile."
  assuranceProfileCode: String
  """
  What the caller may do to the organization's members, and why not when they can't. Console decides
  it once per organization, so every member carries the same list. An action the
  caller's role does not grant is absent from the list, rather than present with allowed: false.
  """
  allowedActions: [ConsoleActionAffordance!]!
}

# @category: console/members
"A page of the members of the caller's organization."
type ConsoleMemberConnection implements Connection {
  edges: [ConsoleMemberEdge!]!
  nodes: [ConsoleMember!]!
  pageInfo: PageInfo!
  "The total count of items matching the filter."
  total: CountInfo
}

# @category: console/members
"An edge in a ConsoleMemberConnection."
type ConsoleMemberEdge implements Edge {
  "An opaque cursor for this edge."
  cursor: String!
  node: ConsoleMember!
}

# @category: console/products
"""
Console's own workspace-product toggle state, derived from whether a subscription the workspace
holds covers the product and what Console last asked for (desired) versus what it has last observed.
"""
enum ConsoleWorkspaceProductState {
  "No active subscription of the workspace covers this product; Console does not check that another plan offers it."
  AVAILABLE_ON_OTHER_PLANS
  "Covered by a subscription the workspace holds, but not toggled on."
  NOT_ENABLED
  """
  Covered, desired is enabled, and Console has not yet observed it ready — including a product a
  covering plan turns on at workspace creation.
  """
  ENABLING
  "Covered, desired is enabled, and Console has observed it ready."
  ENABLED
  "A workspaceProductDisable is in flight."
  DISABLING
  "The last toggle did not reach the desired state; see ConsoleWorkspaceProduct.lastFailureCode."
  FAILED
}

# @category: console/products
"Whether the caller may take one action on a workspace product, and why not when they can't."
type ConsoleActionAffordance {
  "The action this affordance is about, e.g. \"attach_product\" or \"detach_product\"."
  action: String!
  "Whether the caller may take this action right now."
  allowed: Boolean!
  "Why not, when allowed is false. Null when allowed is true."
  reason: String
}

# @category: console/products
"One product a workspace may or does have enabled, as Console reports it."
type ConsoleWorkspaceProduct {
  "Billing's id for the product, relayed by Console: the same value as `BillingProductDomain.id`."
  productId: ID!
  "nvx4 billing's own product code (BillingProductDomain.code), relayed by Console, e.g. \"bdr\"."
  code: String!
  "Human-readable product name."
  displayName: String!
  "Human-readable product description. Null when Console has none."
  description: String
  "Whether the workspace's current plan covers this product."
  covered: Boolean!
  "Whether the plan covering this product turned it on by default when this workspace was created."
  isDefault: Boolean!
  """
  Whether the covering plan requires this product: Console refuses both enabling and disabling it
  (PRODUCT_MANAGED_BY_PLAN), except re-enabling it after FAILED.
  """
  isRequired: Boolean!
  """
  Billing's id for the subscription covering this product, the same value as
  `BillingWorkspaceSubscription.id`. Non-null exactly when covered is true: Console's coverage comes
  only from subscriptions.
  """
  coveredBySubscriptionId: ID
  "The name of the plan covering this product, when covered by a plan."
  coveredByPlanName: String
  "When coverage from a plan or subscription lapsed, if it ever did. Null while still covered, or never covered."
  coverageLostAt: DateTime
  """
  What Console converges the product to, set by a toggle or by a plan that installs the product.
  Null when the product was never installed in this workspace.
  """
  desiredState: String
  """
  When a user last set desiredState. Null when no user ever has, including a product a plan
  installed.
  """
  intentSetAt: DateTime
  "What Console has last observed the product's actual state to be, independent of what was asked for."
  observedState: String!
  """
  Bumped whenever Console sends a new command for the installation, including on coverage loss;
  distinguishes a stale observation from a fresh one.
  """
  generation: Long!
  "Console's own code for why the last toggle did not reach the desired state. Null otherwise."
  lastFailureCode: String
  "The product's current toggle state."
  state: ConsoleWorkspaceProductState!
  """
  What the caller may do next, and why not when they can't. An action the caller's role does not
  grant is absent from the list, rather than present with allowed: false.
  """
  allowedActions: [ConsoleActionAffordance!]!
}

# @category: console/products
"One entry of Console's own product catalog."
type ConsoleProductCatalogEntry {
  "Billing's id for the product, relayed by Console: the same value as `BillingProductDomain.id`."
  id: ID!
  "nvx4 billing's own product code (BillingProductDomain.code), relayed by Console, e.g. \"bdr\"."
  code: String!
  "Human-readable product name. Null when Console has none."
  displayName: String
  "Human-readable product description. Null when Console has none."
  description: String
  "Whether the product is currently offered. productCatalog(activeOnly: true) excludes the rest."
  isActive: Boolean!
  "Whether the default plan turns this product on when a workspace is created."
  isDefault: Boolean!
  "Whether the default plan requires this product."
  isRequired: Boolean!
  """
  The product's user-facing URL, read from nvx4 billing's product domain of this id
  (BillingProductDomain.productUrl) rather than from Console. Null when billing has none or has no
  product domain of this id.
  """
  productUrl: String
  """
  The product's internal path, read from nvx4 billing's product domain of this id
  (BillingProductDomain.internalPath) rather than from Console. Null when billing has none or has no
  product domain of this id.
  """
  internalPath: String
}

# @category: console/products
"One workspace operation Console tracked, read back in full."
type ConsoleWorkspaceOperation {
  "Console's own operation id, the `id` that `workspaceOperation` takes. `node(id:)` answers null for it."
  id: ID!
  "The workspace the operation acted on, by the same id as `Workspace.id`."
  workspaceId: ID!
  "The organization the workspace belongs to, by the same id as `ConsoleOrganization.id`."
  organizationId: ID!
  """
  Console's own operation-type vocabulary: provision, update, stop, start, delete, product_attach
  or product_detach.
  """
  operationType: String!
  "Console's own operation-status vocabulary: accepted, in_progress, completed, failed or cancelled."
  status: String!
  """
  The idempotency key the request carried, if any. Always null for product_attach/product_detach:
  Console does not record one for a product toggle. Null on other operation types when none was given.
  """
  idempotencyKey: UUID
  "The user who requested the operation, if any. Null when it was not a user."
  actorUserId: UUID
  "The agent that requested the operation, if any. Null when it was not an agent."
  actorAgentId: UUID
  """
  For a product_attach/product_detach operation, Console's own id for the underlying product
  installation it is tracking. Null on other operation types, or when Console recorded none.
  """
  externalOperationId: String
  "Console's own code for why the operation failed. Null unless status is failed."
  failureReason: String
  "When Console created the operation record."
  createdAt: DateTime!
  "When Console last updated the operation record."
  updatedAt: DateTime!
}

# @category: console/products
"Input for enabling a product on a workspace."
input ConsoleWorkspaceProductEnableInput {
  """
  The workspace to enable the product on, by the same id as `Workspace.id`. A value that is not a
  workspace id is refused with VALIDATION_ERROR.
  """
  workspaceId: ID!
  "nvx4 billing's own product code (BillingProductDomain.code), relayed by Console, e.g. \"bdr\"."
  productCode: Code!
}

# @category: console/products
"Input for disabling a product on a workspace."
input ConsoleWorkspaceProductDisableInput {
  """
  The workspace to disable the product on, by the same id as `Workspace.id`. A value that is not a
  workspace id is refused with VALIDATION_ERROR.
  """
  workspaceId: ID!
  """
  Billing's id for the product to disable, the same value as `ConsoleWorkspaceProduct.productId` and
  `BillingProductDomain.id`. A value that is not a product id is refused with VALIDATION_ERROR.
  """
  productId: ID!
}

# @category: console/products
"""
The short receipt Console answers a toggle request with (its 202 body), not the operation read
back in full. The change is accepted and runs asynchronously; follow it with
`console.workspaceOperation(id)` for the outcome. `status` starts as `"accepted"`.
"""
type ConsoleWorkspaceOperationReceipt {
  "Console's own operation id. Pass this to workspaceOperation to follow the toggle to completion."
  id: ID!
  "The workspace the operation acts on, by the same id as `Workspace.id`."
  workspaceId: ID!
  "Console's own operation-type vocabulary: for a toggle, product_attach or product_detach."
  operationType: String!
  "Console's own operation-status vocabulary. Starts as \"accepted\" on this receipt."
  status: String!
  "When Console created the operation record."
  createdAt: DateTime!
}

# @category: console/products
"The result of toggling a workspace product."
type ConsoleWorkspaceOperationPayload {
  "The receipt Console answered the toggle request with. Follow it with workspaceOperation for the outcome."
  operation: ConsoleWorkspaceOperationReceipt!
}

# @category: console/api-keys
"""
Console module queries — the organizations and workspaces a caller can reach, the members of their
organization, and workspace products, as Console reports them, and Console's audit events of the
organization.
"""
type ConsoleQuery {
  # @category: console/organizations
  "Organizations the caller can access."
  accessibleOrganizations(
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination). Requires `before` — Console pages backward only from a cursor."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination). Requires `last`."
    before: String
  ): ConsoleOrganizationConnection!

  # @category: console/workspaces
  "Workspaces the caller can access, optionally narrowed to one organization."
  accessibleWorkspaces(
    """
    Restrict to workspaces of this organization. Omitted means every accessible organization. A value
    that is not an organization id is refused with VALIDATION_ERROR naming `organizationId`.
    """
    organizationId: ID
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination). Requires `before` — Console pages backward only from a cursor."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination). Requires `last`."
    before: String
  ): ConsoleWorkspaceConnection!

  # @category: console/members
  "Members of the caller's organization, the one the token's `organization_id` claim names, ordered by actorId."
  members(
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination). Requires `before`."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination). Requires `last`."
    before: String
  ): ConsoleMemberConnection!

  # @category: console/products
  "Every product the workspace may or does have enabled."
  workspaceProducts(
    """
    The workspace to list products for, by the same id as `Workspace.id`. A value that is not a
    workspace id is refused with VALIDATION_ERROR naming `workspaceId`.
    """
    workspaceId: ID!
  ): [ConsoleWorkspaceProduct!]!

  # @category: console/products
  "Console's own product catalog."
  productCatalog(
    "Restrict to products Console currently offers. Defaults to true."
    activeOnly: Boolean! = true
  ): [ConsoleProductCatalogEntry!]!

  # @category: console/products
  """
  One workspace operation Console tracked, of any type. Null only when Console answers 404: no such
  operation is visible in the caller's organization. A caller without the view action on the
  workspace gets PERMISSION_DENIED instead.
  """
  workspaceOperation(
    """
    Console's own id for the operation. A value that is not an operation id is refused with VALIDATION_ERROR
    naming `id`.
    """
    id: ID!
  ): ConsoleWorkspaceOperation

  # @category: console/audit
  """
  The audit events Console keeps of the caller's organization, the one the token names, newest first by default.
  Console authorizes the read itself, from the caller's membership of the organization and access in Console: a
  caller it refuses gets PERMISSION_DENIED with `extensions.dependency` `console`. Only `console`'s events are read:
  `filter.products` absent or empty reads them, and naming any other product fails with VALIDATION_ERROR.
  `AuditEvent.workspace` resolves only to the caller's own workspace, the one the token names, and is null for an
  event of another workspace or of none. `node(id:)` does not resolve these events. The types are the ones
  `BdrQuery.myAuditEvents` returns too.
  """
  myAuditEvents(
    "Filtering options for the returned events."
    filter: AuditEventFilter
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    before: String
    "The ordering options for the returned events."
    orderBy: AuditEventOrder = { field: OCCURRED_AT, direction: DESC }
  ): AuditEventConnection!

  # @category: console/audit
  """
  The audit events Console keeps about one entity of the caller's organization, such as a workspace or an API key,
  newest first by default. The access and the products are as for `myAuditEvents`.
  """
  myEntityHistory(
    "The ID of the entity whose events to return."
    entityId: ID!
    "Filtering options for the returned events."
    filter: AuditEventFilter
    "The first `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    first: Int
    "The elements that come after the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    after: String
    "The last `n` elements from the [paginated list](https://navixy.com/docs/navixy-graphql-api/pagination)."
    last: Int
    "The elements that come before the specified [cursor](https://navixy.com/docs/navixy-graphql-api/pagination)."
    before: String
    "The ordering options for the returned events."
    orderBy: AuditEventOrder = { field: OCCURRED_AT, direction: DESC }
  ): AuditEventConnection!
}

"""
Console module mutations — enable and disable products on a workspace.
"""
type ConsoleMutation {
  # @category: console/products
  """
  Enables a product on a workspace. Answers once Console accepts the request; the toggle itself
  completes asynchronously — poll `workspaceOperation` or `workspaceProducts` for the outcome.
  """
  workspaceProductEnable(
    "The input fields for enabling the product."
    input: ConsoleWorkspaceProductEnableInput!
  ): ConsoleWorkspaceOperationPayload @effect(kinds: [PEOPLE, MONEY])

  # @category: console/products
  """
  Disables a product on a workspace. Answers once Console accepts the request; the toggle itself
  completes asynchronously — poll `workspaceOperation` or `workspaceProducts` for the outcome.
  """
  workspaceProductDisable(
    "The input fields for disabling the product."
    input: ConsoleWorkspaceProductDisableInput!
  ): ConsoleWorkspaceOperationPayload @effect(kinds: [PEOPLE, MONEY])
}
