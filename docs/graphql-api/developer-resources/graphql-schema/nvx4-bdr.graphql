  """
  Created by BDR in the current workspace when the workspace was activated. Only asset types have this
  origin: the base types Workforce, Vehicle and Cargo, told apart by their `code` (`workforce`,
  `vehicle`, `cargo`), which cannot change. The workspace owns the item and can edit or delete it like a
  `WORKSPACE` one. A type the workspace creates itself is `WORKSPACE`, whatever its code.
  """
  PRESET
}

