# The contract's only `schema { ... }` definition. Two across the merged contract set is a hard
# startup failure (SchemaRedefinitionError), not last-wins — see TypeDefinitionRegistry.merge /
# checkMergeSchemaDefs in graphql-java. Lives here rather than in nvx4-common.graphql because it
# names Query/Mutation, which are declared in this file, and because Apollo Kotlin's codegen
# classifies any schemaFiles entry containing a `schema { ... }` block or a type named `Query` as
# "a schema" and errors if more than one qualifies — this file already qualifies via `type Query`.
#
# `Subscription` is the one root named here and declared elsewhere — nvx4-tracking.graphql, as of
# 0.11.0, beside the batch it streams (§21 below, and that file's §7). That leaves the classifier
# above deciding between two files that each declare a root type, which the rule as written does not
# cover — it names `schema { … }` and `type Query`, neither of which moved. Settled by running it
# rather than by reading it: `:sdk:api-client:generateApolloSources` is green with `Subscription`
# declared in nvx4-tracking.graphql, which is also in Apollo's `schemaFiles`.
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# =============================================================================
# 19. QUERY
# =============================================================================

"The root query type."
type Query {
  # @category: common
  "Retrieves any entity by its globally unique identifier."
  node("The ID of the entity to retrieve." id: ID!): Node

  # @category: common
  "Retrieves multiple entities by their globally unique identifiers. Returns items in the same order as the input IDs."
