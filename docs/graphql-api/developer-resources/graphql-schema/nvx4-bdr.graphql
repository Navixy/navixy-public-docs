# =============================================================================
# 15. CUSTOM FIELDS
# =============================================================================
#
# The custom-field vocabulary moved to `contracts/graphql/nvx4-common.graphql`
# (docs/adr/015-api-module-namespacing.md §Decision item 3): `CustomFieldDefinition`,
# `FieldTypeAvailability`, `FieldParams`, `FieldParamsString`, `FieldParamsText`,
# `FieldParamsDecimal`, `FieldParamsInteger`, `FieldParamsBoolean`, `FieldParamsDate`,
# `FieldParamsDatetime`, `FieldParamsGeojson`, `FieldParamsOptions` and `FieldOption`.
#
# `FieldParamsDevice` and `FieldParamsReference` stay here — see the comment on each below.

# `FieldParamsDevice` stays here, not in the kernel — its `refSubtypes` field returns
# `[CatalogItem]`, a BDR catalog interface, so moving it would make the kernel depend on BDR. It
# still implements (not `extend`s) the kernel's `FieldParams` interface from this file — legal
# GraphQL; see the note on `DeviceCustomFieldValue` in §9 above, and
# docs/reference/graphql-conventions.md §Module namespacing, for why `extend`ing a kernel type
# from a module file is forbidden — and, unlike a plain reference, fails the closure gate.
# @category: bdr/custom-fields
"Parameters for DEVICE field type."
type FieldParamsDevice implements FieldParams {
  isRequired: Boolean!
  """
  The device types a value may belong to. Empty means any device type is allowed.

  An element is null when the device type behind it no longer resolves — see
  `FieldParamsReference.refSubtypes`, which is resolved by the same loader.
  """
  refSubtypes: [CatalogItem]!
}

# `FieldParamsReference` stays here, not in the kernel — its `refSubtypes` field returns
# `[CatalogItem]`, a BDR catalog interface, so moving it would make the kernel depend on BDR. It
# still implements (not `extend`s) the kernel's `FieldParams` / `MultiValue` interfaces from this
# file — legal GraphQL; see the note on `DeviceCustomFieldValue` in §9 above, and
# docs/reference/graphql-conventions.md §Module namespacing, for why `extend`ing a kernel type
# from a module file is forbidden — and, unlike a plain reference, fails the closure gate.
# @category: bdr/custom-fields
"Parameters for REFERENCE field type."
type FieldParamsReference implements FieldParams & MultiValue {
  isRequired: Boolean!
  isMulti: Boolean!
  "The entity type code that can be referenced."
  refEntityTypeCode: Code!
  """
  The subtypes a value may belong to (AssetType / GeoObjectType / catalog).
  Empty means the whole target type is allowed.

  An element is null when its subtype no longer resolves — the classifier item was deleted
  after the narrowing was validated on write. Nullable for the same reason as `defaultRefs`
  below: both are resolved while `FieldParams!` itself is built, so a non-null element type
  would let one dangling subtype blank an entire page of catalog types, even for a query that
  never selects this field.
  """
  refSubtypes: [CatalogItem]!
  """
  The default referenced entities. Empty when the field has no default.

  An element is null when its target no longer resolves — the entity was deleted after the
  default was validated on write. Nullable for the same reason as
  `ReferenceCustomFieldValue.refs`: `FieldParams!` is non-null on `CustomFieldDefinition!`
  inside a non-null `customFieldDefinitions` list, so a non-null element type would let one
  dangling default blank an entire page of catalog types.
  """
  defaultRefs: [Node]!
}

