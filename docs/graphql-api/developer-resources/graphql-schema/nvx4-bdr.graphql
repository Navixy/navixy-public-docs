# =============================================================================
# 17. FILTER & ORDER INPUTS
# =============================================================================
#
# FILTER SEMANTICS
# ----------------
# Array-based filters use OR logic within a field and AND logic between fields.
#
# Example:
#   filter: {
#     typeIds: ["type1", "type2"]    # type1 OR type2
#     statusIds: ["active"]          # AND status = active
#   }
#
# This returns items where:
#   (type = type1 OR type = type2) AND (status = active)
#
# Empty arrays are ignored (treated as "no filter on this field").
# Null values are also ignored.
#
# =============================================================================

