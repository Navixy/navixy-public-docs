# @category: bdr/devices
"Input for creating a new device."
input DeviceCreateInput {
  "The device type ID."
  typeId: ID!
  "The device model ID."
  modelId: ID!
  """
  The device display name. If omitted or blank, the server generates
  "<vendor.title> <model.title> <identifier.value>" where the identifier
  is chosen by type priority: IMEI > SERIAL_NUMBER > MAC_ADDRESS, with
  fallback to identifiers[0] when none of the priority types are present.
  With no identifiers at all the generated title is "<vendor.title> <model.title>".
  """
  title: String @trim
  """
  The hardware identifiers. Optional: a device may be registered before its hardware
  is known. Identifiers can be added later with `deviceIdentifierAdd`.
  """
  identifiers: [DeviceIdentifierInput!]
  """
  Optionally assign the new device to an existing inventory. When provided, the
  inventory must belong to the same workspace; the assignment is atomic with
  device creation (the device is not created if the assignment fails).
  """
  inventoryId: ID
}

