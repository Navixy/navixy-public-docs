# =============================================================================
# 21. SUBSCRIPTION
# =============================================================================
#
# Subscription fields are NOT namespaced behind a wrapper the way `Query.bdr` and
# `Query.tracking` are, and the exception is structural rather than stylistic: a subscription's
# root field is the event source and must resolve to the stream itself. A wrapper object would
# have to be emitted once and then stream from a nested field, which the specification does not
# provide for. Module ownership therefore lives in the field name — `trackingAssetStates`, not
# `tracking { assetStates }`. Recorded in docs/reference/graphql-conventions.md §Subscriptions.
#
# The type lives here, with the other roots, while the types it returns belong to their modules.

"The root subscription type."
type Subscription {
  # @category: tracking
  """
  Full state of each followed asset, re-emitted whenever any of its devices reports.

  Every message carries the whole state rather than a delta, so a client holds no state machine
  and a reconnect needs no reconciliation. The emission is a batch — see
  `TrackingAssetStateBatch` — which is what carries the opening-snapshot markers and lets an
  asset report that it has left the subscription.
  """
  trackingAssetStates(
    "What to follow, and how much of each state to deliver."
    input: TrackingAssetStateSubscriptionInput!
  ): TrackingAssetStateBatch!

  # @category: tracking
  "Full state of each followed device, re-emitted whenever it reports."
  trackingDeviceStates(
    "What to follow, and how much of each state to deliver."
    input: TrackingDeviceStateSubscriptionInput!
  ): TrackingDeviceStateBatch!
}

