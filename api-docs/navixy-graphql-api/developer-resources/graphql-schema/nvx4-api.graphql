# =============================================================================
# 9. INTERFACES
# =============================================================================

# `Titled`, `Customizable` and `CustomFieldValue` moved to `contracts/graphql/nvx4-common.graphql`
# — custom-field vocabulary. `Titled` moves as kernel vocabulary in its own right, not merely as a
# bridge for `CustomFieldDefinition` — its exclusion from the original kernel extraction is now
# superseded (docs/adr/015-api-module-namespacing.md §Decision item 3).

# `StringCustomFieldValue`, `DecimalCustomFieldValue`, `IntegerCustomFieldValue`,
# `BooleanCustomFieldValue`, `DateCustomFieldValue`, `DateTimeCustomFieldValue`,
# `GeoJsonCustomFieldValue` and `OptionsCustomFieldValue` moved to
# `contracts/graphql/nvx4-common.graphql` — custom-field vocabulary
# (docs/adr/015-api-module-namespacing.md §Decision item 3).

# `DeviceCustomFieldValue` stays here, not in the kernel — it names `Device`, a BDR entity type,
# so moving it would make the kernel depend on BDR. It still implements (not `extend`s) the
# kernel's `CustomFieldValue` interface from this file — legal GraphQL, since `implements` does
# not change the interface's own shape. A module file must never `extend type` a kernel type
# instead, and `GraphqlSchemaValidationTest$StandaloneFileClosure` enforces it: a module's plain
# references may resolve into the kernel, but its `extend` targets may not, so a module `extend`ing
# a kernel type fails the gate
# (docs/adr/015-api-module-namespacing.md §Decision item 3;
# docs/reference/graphql-conventions.md §Module namespacing).
# @category: custom-fields
"DEVICE custom-field value (primary-capable)."
