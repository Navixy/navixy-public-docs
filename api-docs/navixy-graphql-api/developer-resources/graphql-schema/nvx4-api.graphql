# 7. SCALAR TYPES
# =============================================================================

# Note: The built-in ID scalar is used for entity identifiers.
# ID values are opaque strings in UUID format.
# Format: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
# Example: "019a6a3f-793e-807b-8001-555345529b44"
#
# The internal bit layout is not published here. It used to be, "for debugging reference only",
# which contradicted the sentence above it: a client told to treat an ID as opaque, and handed a
# field-by-field decoding of it in the same breath, will parse it. What clients need is stated
# without the layout — an ID is opaque, `Query.node(id:)` resolves it, and `scalar UUID` is the
# type for an identifier this API does not mint.

# `Date` moved to `contracts/graphql/nvx4-common.graphql` — custom-field vocabulary
# (docs/adr/015-api-module-namespacing.md §Decision item 3).

# `UUID` moved to `contracts/graphql/nvx4-common.graphql`: an identifier minted outside this API
# is not a BDR concept, and tracking needs it for `TrackingEvent.commandId`. Used by more than one
# module is the kernel's own admission rule.

