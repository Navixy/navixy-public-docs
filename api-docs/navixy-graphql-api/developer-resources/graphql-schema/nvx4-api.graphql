  The device display name. If omitted or blank, the server generates
  "<vendor.title> <model.title> <identifier.value>" where the identifier
  is chosen by type priority: IMEI > SERIAL_NUMBER > MAC_ADDRESS, with
  fallback to identifiers[0] when none of the priority types are present.
  With no identifiers at all the generated title is "<vendor.title> <model.title>".
